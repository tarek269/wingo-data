<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Wingo 24/7 ডেটা ভিউয়ার</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #050308;
            color: #f2eef6;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px;
        }
        .container { max-width: 500px; width: 100%; }
        .header {
            text-align: center;
            padding: 16px 0 12px;
            border-bottom: 1px solid rgba(255,45,75,0.12);
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff2d4b, #ffc93c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { font-size: 11px; color: rgba(242,238,246,0.45); }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.035);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .live-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #00ffa8;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .live-badge { display: flex; align-items: center; gap: 8px; font-weight:700; font-size:13px; color:#00ffa8; }
        .info-text { font-size:12px; color:#94a3b8; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .stat-box {
            background: rgba(255,255,255,0.035);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .stat-value { font-size:20px; font-weight:900; }
        .stat-value.green { color:#00ffa8; }
        .stat-value.gold { color:#ffc93c; }
        .stat-value.blue { color:#22d3ee; }
        .stat-value.purple { color:#c084fc; }
        .stat-label { font-size:8px; color:rgba(242,238,246,0.45); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
        .history-section {
            background: rgba(255,255,255,0.035);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            max-height: 450px;
            overflow-y: auto;
        }
        .history-section::-webkit-scrollbar { width:3px; }
        .history-section::-webkit-scrollbar-thumb { background:rgba(255,45,75,0.2); border-radius:4px; }
        .history-title {
            font-size:11px;
            color:rgba(242,238,246,0.45);
            letter-spacing:2px;
            font-weight:700;
            margin-bottom:10px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size:13px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .history-period { font-family:'Courier New',monospace; color:#94a3b8; font-size:11px; }
        .history-number { font-weight:700; font-size:15px; }
        .history-number.big { color:#f97316; }
        .history-number.small { color:#22d3ee; }
        .history-mode { font-size:10px; color:#64748b; background:rgba(255,255,255,0.05); padding:2px 8px; border-radius:10px; }
        .empty-state { text-align:center; color:#475569; padding:30px 0; font-size:14px; }
        .footer {
            text-align: center;
            padding: 16px 0 8px;
            font-size:9px;
            color:#334155;
            letter-spacing:1.5px;
        }
        .last-update { text-align: center; font-size:11px; color:#64748b; margin-bottom:12px; }
        .badge-24h {
            display: inline-block;
            background: rgba(255,201,60,0.12);
            color: #ffc93c;
            padding: 4px 12px;
            border-radius: 20px;
            font-size:10px;
            font-weight:700;
            border: 1px solid rgba(255,201,60,0.2);
            margin-bottom: 8px;
        }
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.035);
            color: #94a3b8;
            font-size:11px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.3s;
        }
        .filter-btn.active {
            border-color: #ff2d4b;
            background: rgba(255,45,75,0.08);
            color: #ff2d4b;
        }
        .filter-btn:active { transform:scale(0.95); }
        .refresh-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            background: rgba(255,45,75,0.15);
            color: #ff2d4b;
            font-weight:700;
            font-size:11px;
            cursor:pointer;
        }
        .refresh-btn:active { transform:scale(0.95); }
        .header-actions { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 WINGO 24/7 DATA</h1>
            <p>২৪ ঘন্টা ডেটা সংরক্ষিত • যেকোনো সময় দেখুন</p>
        </div>

        <div class="badge-24h">⏰ ২৪/৭ অটো কালেক্ট চলছে</div>

        <div class="status-bar">
            <div class="live-badge">
                <span class="live-dot"></span>
                <span id="statusText">সংযুক্ত</span>
            </div>
            <span class="info-text" id="dataCount">ডেটা: ০</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><div class="stat-value green" id="statTotal">0</div><div class="stat-label">📦 মোট</div></div>
            <div class="stat-box"><div class="stat-value gold" id="statBig">0</div><div class="stat-label">🔴 BIG</div></div>
            <div class="stat-box"><div class="stat-value blue" id="statSmall">0</div><div class="stat-label">🔵 SMALL</div></div>
            <div class="stat-box"><div class="stat-value purple" id="statPeriods">0</div><div class="stat-label">📅 পিরিয়ড</div></div>
        </div>

        <div class="header-actions">
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">সব</button>
                <button class="filter-btn" data-filter="30s" onclick="setFilter('30s')">⚡ 30s</button>
                <button class="filter-btn" data-filter="1m" onclick="setFilter('1m')">⏱️ 1m</button>
            </div>
            <button class="refresh-btn" onclick="loadData()">🔄 রিফ্রেশ</button>
        </div>

        <div class="last-update" id="lastUpdate">শেষ আপডেট: লোড হচ্ছে...</div>

        <div class="history-section">
            <div class="history-title">📜 সম্পূর্ণ ইতিহাস</div>
            <div id="historyList">
                <div class="empty-state">⏳ ডেটা লোড হচ্ছে...</div>
            </div>
        </div>

        <div class="footer">🧠 ২৪/৭ ডেটা কালেক্টর • GitHub Actions</div>
    </div>

    <script>
        // আপনার GitHub URL দিন
        const DATA_URL = 'https://raw.githubusercontent.com/tarek269/wingo-data/main/history.json';

        let allData = [];
        let currentFilter = 'all';

        async function loadData() {
            try {
                document.getElementById('historyList').innerHTML = 
                    '<div class="empty-state">⏳ ডেটা লোড হচ্ছে...</div>';

                const response = await fetch(DATA_URL + '?t=' + Date.now());
                
                if (!response.ok) throw new Error('ডেটা পাওয়া যায়নি');

                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('কোনো ডেটা নেই');
                }

                allData = data;
                renderData(currentFilter);
                updateStats(allData);
                document.getElementById('lastUpdate').textContent = 
                    `শেষ আপডেট: ${new Date().toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka' })}`;
                document.getElementById('statusText').textContent = '✅ সংযুক্ত';
                document.getElementById('dataCount').textContent = `ডেটা: ${allData.length}`;

            } catch (error) {
                document.getElementById('historyList').innerHTML = `
                    <div class="empty-state">
                        ❌ ডেটা লোড করা যায়নি<br>
                        <small style="color:#334155;">${error.message}</small><br><br>
                        <small style="color:#64748b;">
                            ⚠️ চেক করুন:<br>
                            1. Repository Public কিনা<br>
                            2. URL ঠিক কিনা<br>
                            3. history.json আছে কিনা
                        </small>
                    </div>
                `;
                document.getElementById('statusText').textContent = '⚠️ সংযোগ নেই';
            }
        }

        function renderData(filter) {
            const list = document.getElementById('historyList');
            
            let filtered = allData;
            if (filter === '30s') filtered = allData.filter(d => d.mode === '30s');
            else if (filter === '1m') filtered = allData.filter(d => d.mode === '1m');

            filtered.sort((a, b) => parseInt(b.period) - parseInt(a.period));

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">📭 এই ফিল্টারে কোনো ডেটা নেই</div>';
                return;
            }

            const seen = new Set();
            const unique = filtered.filter(d => {
                const key = d.period + '|' + d.mode;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            list.innerHTML = unique.slice(0, 500).map(item => {
                const num = parseInt(item.number);
                const size = num >= 5 ? 'big' : 'small';
                const sizeLabel = num >= 5 ? '🔴 BIG' : '🔵 SMALL';
                const modeLabel = item.mode === '30s' ? '⚡30s' : '⏱️1m';
                return `
                    <div class="history-item">
                        <span class="history-period">#${item.period}</span>
                        <span class="history-number ${size}">${num}</span>
                        <span class="history-mode">${modeLabel}</span>
                        <span style="font-size:11px;color:#64748b;">${sizeLabel}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('dataCount').textContent = `ডেটা: ${unique.length}`;
        }

        function updateStats(data) {
            const total = data.length;
            const big = data.filter(d => parseInt(d.number) >= 5).length;
            const periods = new Set(data.map(d => d.period));
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statBig').textContent = big;
            document.getElementById('statSmall').textContent = total - big;
            document.getElementById('statPeriods').textContent = periods.size;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderData(filter);
        }

        setInterval(loadData, 120000);
        loadData();
        console.log('📊 Wingo Viewer Started');
    </script>
</body>
</html>
