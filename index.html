<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Wingo 24/7 ডেটা ভিউয়ার</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0b0b1a;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container { max-width: 600px; margin: auto; }
        .card {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid #2a2a4a;
        }
        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #ff2d4b, #ffc93c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: #ffc93c22;
            color: #ffc93c;
            padding: 6px 16px;
            border-radius: 30px;
            display: inline-block;
            font-size: 12px;
            font-weight: bold;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #12122a;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .live-dot {
            width: 10px; height: 10px;
            background: #00ffa8;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%,100%{opacity:1}
            50%{opacity:0.3}
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: #12122a;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-box .num { font-size: 22px; font-weight: 900; }
        .stat-box .label { font-size: 10px; color: #888; text-transform: uppercase; }
        .green { color: #00ffa8; }
        .gold { color: #ffc93c; }
        .blue { color: #22d3ee; }
        .purple { color: #c084fc; }
        .history {
            max-height: 400px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 4px;
            border-bottom: 1px solid #1a1a3a;
            font-size: 14px;
        }
        .history-item .period { color: #888; font-size: 12px; }
        .history-item .num { font-weight: bold; }
        .history-item .num.big { color: #f97316; }
        .history-item .num.small { color: #22d3ee; }
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #12122a;
            border: 1px solid #2a2a4a;
            color: #aaa;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .filter-btn.active {
            border-color: #ff2d4b;
            background: #ff2d4b22;
            color: #ff2d4b;
        }
        .refresh-btn {
            background: #ff2d4b22;
            border: none;
            color: #ff2d4b;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer { text-align: center; font-size: 10px; color: #444; margin-top: 16px; }
        .last-update { font-size:12px; color:#888; margin-bottom:12px; }
        .empty-state { text-align:center; color:#555; padding:30px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card header">
            <h1>📊 WINGO 24/7 DATA</h1>
            <p style="color:#888;font-size:12px;">২৪/৭ অটো কালেক্ট • যেকোনো সময় দেখুন</p>
            <div style="margin-top:8px;"><span class="badge">⏰ ২৪/৭ চলছে</span></div>
        </div>

        <div class="status-bar">
            <div><span class="live-dot"></span> <span id="statusText">সংযুক্ত</span></div>
            <span id="dataCount">ডেটা: ০</span>
        </div>

        <div class="stats">
            <div class="stat-box"><div class="num green" id="statTotal">0</div><div class="label">📦 মোট</div></div>
            <div class="stat-box"><div class="num gold" id="statBig">0</div><div class="label">🔴 BIG</div></div>
            <div class="stat-box"><div class="num blue" id="statSmall">0</div><div class="label">🔵 SMALL</div></div>
            <div class="stat-box"><div class="num purple" id="statPeriods">0</div><div class="label">📅 পিরিয়ড</div></div>
        </div>

        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">সব</button>
                    <button class="filter-btn" data-filter="30s" onclick="setFilter('30s')">⚡ 30s</button>
                    <button class="filter-btn" data-filter="1m" onclick="setFilter('1m')">⏱️ 1m</button>
                </div>
                <button class="refresh-btn" onclick="loadData()">🔄 রিফ্রেশ</button>
            </div>
            <div class="last-update" id="lastUpdate">শেষ আপডেট: লোড হচ্ছে...</div>
            <div class="history" id="historyList">
                <div class="empty-state">⏳ ডেটা লোড হচ্ছে...</div>
            </div>
        </div>

        <div class="footer">🧠 ২৪/৭ ডেটা কালেক্টর • GitHub Actions</div>
    </div>

    <script>
        // আপনার ইউজারনেম এবং রেপো নাম দিন
        const USERNAME = 'tarek269';
        const REPO = 'wingo-data';
        const DATA_URL = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/history.json`;

        let allData = [];
        let currentFilter = 'all';

        async function loadData() {
            try {
                document.getElementById('historyList').innerHTML = '<div class="empty-state">⏳ ডেটা লোড হচ্ছে...</div>';
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) throw new Error('কোনো ডেটা নেই');
                allData = data;
                renderData(currentFilter);
                updateStats(allData);
                document.getElementById('lastUpdate').textContent = `শেষ আপডেট: ${new Date().toLocaleString('bn-BD', {timeZone:'Asia/Dhaka'})}`;
                document.getElementById('statusText').textContent = '✅ সংযুক্ত';
                document.getElementById('dataCount').textContent = `ডেটা: ${allData.length}`;
            } catch (e) {
                document.getElementById('historyList').innerHTML = `
                    <div class="empty-state">
                        ❌ ডেটা লোড করা যায়নি<br>
                        <small style="color:#888;">${e.message}</small><br><br>
                        <small style="color:#666;">⚠️ চেক করুন: Repository Public কিনা, URL ঠিক কিনা</small>
                    </div>
                `;
                document.getElementById('statusText').textContent = '⚠️ সংযোগ নেই';
            }
        }

        function renderData(filter) {
            const list = document.getElementById('historyList');
            let filtered = allData;
            if (filter === '30s') filtered = allData.filter(d => d.mode === '30s');
            else if (filter === '1m') filtered = allData.filter(d => d.mode === '1m');
            filtered.sort((a, b) => parseInt(b.period) - parseInt(a.period));
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">📭 এই ফিল্টারে কোনো ডেটা নেই</div>';
                return;
            }
            const seen = new Set();
            const unique = filtered.filter(d => {
                const key = d.period + '|' + d.mode;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
            list.innerHTML = unique.slice(0, 500).map(item => {
                const num = parseInt(item.number);
                const cls = num >= 5 ? 'big' : 'small';
                const label = num >= 5 ? '🔴 BIG' : '🔵 SMALL';
                const mode = item.mode === '30s' ? '⚡30s' : '⏱️1m';
                return `<div class="history-item">
                    <span class="period">#${item.period}</span>
                    <span class="num ${cls}">${num}</span>
                    <span style="font-size:11px;color:#666;">${mode}</span>
                    <span style="font-size:11px;color:#888;">${label}</span>
                </div>`;
            }).join('');
            document.getElementById('dataCount').textContent = `ডেটা: ${unique.length}`;
        }

        function updateStats(data) {
            const total = data.length;
            const big = data.filter(d => parseInt(d.number) >= 5).length;
            const periods = new Set(data.map(d => d.period));
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statBig').textContent = big;
            document.getElementById('statSmall').textContent = total - big;
            document.getElementById('statPeriods').textContent = periods.size;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
            renderData(filter);
        }

        setInterval(loadData, 120000);
        loadData();
        console.log('📊 Wingo Viewer Started');
    </script>
</body>
            </html>
