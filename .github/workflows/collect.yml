name: Wingo Signal

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get Data
        run: |
          curl -s "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json" > data.json

      - name: Send to Telegram
        run: |
          python3 << 'PYTHON'
          import json, requests, os
          from datetime import datetime

          TOKEN = "8601346832:AAENbaL-vErIXqayABEJMFqdxEQWxwt4stg"
          CHAT = "6678981102"

          with open('data.json') as f:
              data = json.load(f)

          items = data.get('data', {}).get('list', [])
          if not items:
              print("No data")
              exit()

          latest = items[0]
          num = int(latest['number'])
          period = latest['issueNumber']

          size = "BIG" if num >= 5 else "SMALL"
          emoji = "🔴" if num >= 5 else "🔵"

          msg = f"""🎯 *Wingo Signal*

📌 Period: #{period}
🔢 Number: {num}
📏 Size: {emoji} {size}

⏰ Time: {datetime.now().strftime('%I:%M %p')}
"""

          url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
          r = requests.post(url, json={'chat_id': CHAT, 'text': msg, 'parse_mode': 'Markdown'})

          if r.ok:
              print("Sent!")
          else:
              print("Error:", r.text)
          PYTHON
