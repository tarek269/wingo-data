name: Wingo Data Collector

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 30s Data
        run: curl -s "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json" > data30.json
      - name: Fetch 1m Data
        run: curl -s "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json" > data1m.json
      - name: Merge Data
        run: |
          python3 <<EOF
          import json, os
          data = []
          if os.path.exists('history.json'):
              with open('history.json') as f: data = json.load(f)
          for f in ['data30.json','data1m.json']:
              with open(f) as x:
                  for i in json.load(x).get('data',{}).get('list',[]):
                      e={'period':str(i['issueNumber']),'number':int(i['number']),'mode':f[:5]}
                      if not any(d['period']==e['period'] for d in data): data.append(e)
          with open('history.json','w') as f: json.dump(data, f, indent=2)
          print('Saved', len(data), 'entries')
          EOF
      - name: Push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git commit -m "update" || echo "no changes"
          git push
