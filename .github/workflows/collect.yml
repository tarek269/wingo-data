name: Wingo 24/7 Data Collector

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Collect Wingo Data
        run: |
          curl -s "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json" > data_30s.json
          curl -s "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json" > data_1m.json
      
      - name: Merge and Save History
        run: |
          python3 -c "
          import json, os
          with open('data_30s.json') as f:
              d30 = json.load(f)
          with open('data_1m.json') as f:
              d1m = json.load(f)
          history = []
          if os.path.exists('history.json'):
              with open('history.json') as f:
                  history = json.load(f)
          for item in d30.get('data', {}).get('list', []):
              entry = {'period': str(item['issueNumber']), 'number': int(item['number']), 'mode': '30s', 'time': item.get('time', '')}
              if not any(h['period'] == entry['period'] for h in history):
                  history.append(entry)
          for item in d1m.get('data', {}).get('list', []):
              entry = {'period': str(item['issueNumber']), 'number': int(item['number']), 'mode': '1m', 'time': item.get('time', '')}
              if not any(h['period'] == entry['period'] for h in history):
                  history.append(entry)
          with open('history.json', 'w') as f:
              json.dump(history, f, indent=2)
          print(f'Total entries: {len(history)}')
          "
      
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json data_30s.json data_1m.json
          git commit -m "Update Wingo data $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
