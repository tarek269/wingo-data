name: Wingo Data Collector

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download 30s Data
        run: |
          curl -L -o data30.json "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json"
          cat data30.json | head -c 200
      
      - name: Download 1m Data
        run: |
          curl -L -o data1m.json "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json"
          cat data1m.json | head -c 200
      
      - name: Merge and Save
        run: |
          python3 << 'EOF'
          import json, os
          
          # Read existing history
          history = []
          if os.path.exists('history.json'):
              with open('history.json', 'r') as f:
                  try:
                      history = json.load(f)
                  except:
                      history = []
          
          # Process 30s data
          try:
              with open('data30.json', 'r') as f:
                  d30 = json.load(f)
              for item in d30.get('data', {}).get('list', []):
                  entry = {
                      'period': str(item['issueNumber']),
                      'number': int(item['number']),
                      'mode': '30s'
                  }
                  if not any(h['period'] == entry['period'] for h in history):
                      history.append(entry)
          except Exception as e:
              print('Error reading 30s data:', e)
          
          # Process 1m data
          try:
              with open('data1m.json', 'r') as f:
                  d1m = json.load(f)
              for item in d1m.get('data', {}).get('list', []):
                  entry = {
                      'period': str(item['issueNumber']),
                      'number': int(item['number']),
                      'mode': '1m'
                  }
                  if not any(h['period'] == entry['period'] for h in history):
                      history.append(entry)
          except Exception as e:
              print('Error reading 1m data:', e)
          
          # Save
          with open('history.json', 'w') as f:
              json.dump(history, f, indent=2)
          
          print(f'Total entries: {len(history)}')
          EOF
      
      - name: Check and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Update data $(date '+%H:%M')"
          git push || echo "Push skipped"
